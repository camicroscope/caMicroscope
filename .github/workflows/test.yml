

name: Run Tests

on:
  pull_request:
    branches:
      - master
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Start static file server
        run: npx http-server -s . &

      - name: Run linting and tests
        run: |
          npm run lint
          npm test
          npm run test-mocha
